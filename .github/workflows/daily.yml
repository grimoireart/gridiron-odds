# Gridiron Odds daily build (DECISIONS D14).
#
# 10:00 UTC every day September-February (plus manual dispatch): fetch nflverse, rebuild
# model.json / index.html / picks.jsonl, commit only those generated files, then publish
# index.html to GitHub Pages. One run at a time; a failed push fails the job loudly.
#
# Repository settings the owner must make once (see README.md "Going live"):
#   Settings > Pages > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Secrets:  ODDS_API_KEY   (optional; CSV lines without it)
#   Settings > Secrets and variables > Actions > Variables: GRIDIRON_ODDS_URL (optional; the Worker URL)
name: daily build

on:
  schedule:
    - cron: "23 8 * 1,2,9,10,11,12 *"   # 08:23 UTC, Sep-Feb (off the hour: GitHub delays :00 crons by hours)
    - cron: "23 2 * 1,2,9,10,11,12 *"   # 02:23 UTC: grades Sunday/Monday night games before the morning
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Fail the build on purpose to test the failure alert"
        type: boolean
        default: false

concurrency:
  group: gridiron-build
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Simulated failure (manual test of the alert)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "::error::simulate_failure=true: failing on purpose to test the alert"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` can always replay our commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the floor we promise; stdlib only, nothing to install

      # D18: data/ is gitignored, so without this step every run starts with no injury report or depth
      # chart and a failed nflverse download degrades the whole build (every card "unavailable", the
      # term 0 while enabled) with nothing to fall back to. The key is new every run (the post-job save
      # always stores the freshly validated files); restore-keys hands the newest earlier run's files to
      # `injuries.fetch_*`, which then falls back to them exactly as a local build does.
      - name: Restore the nflverse injury report and depth chart caches (an outage reuses the last good files)
        uses: actions/cache@v4
        with:
          path: |
            data/injuries_*.csv
            data/depth_charts_*.csv
          key: nflverse-injuries-${{ github.run_id }}
          restore-keys: |
            nflverse-injuries-

      - name: Build (fetch -> rate -> predict -> sim -> ledger -> model.json -> index.html)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GRIDIRON_ODDS_URL: ${{ vars.GRIDIRON_ODDS_URL }}
        run: make build

      - name: Test (unit tests + Elo reference check on the fresh data)
        run: make test

      - name: Commit and push generated files
        run: |
          set -euo pipefail
          git config user.name "gridiron-odds bot"
          git config user.email "actions@users.noreply.github.com"
          git add model.json index.html picks.jsonl params.json
          if git diff --cached --quiet; then
            echo "nothing changed; no commit"
            exit 0
          fi
          git commit -m "build: $(python3 -c 'import json;print(json.load(open("model.json"))["build"]["id"])')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read     # job-level permissions reset everything else to none; checkout needs this on a private repo
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip AFTER the build job's push

      - name: Stage the site (index.html is self-contained; model.json and picks.jsonl are published for reference)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp model.json picks.jsonl _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Alert the owner by email when anything above fails: an assigned GitHub issue always emails the
  # assignee, unlike workflow-failure mail (which depends on who last edited this file and on their
  # notification settings). One open issue per outage; it is closed automatically by the next success.
  alert:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Open or update the outage issue on failure, close it on success
        run: |
          set -euo pipefail
          open_issue=$(gh issue list --repo "$REPO" --label build-failure --state open --json number --jq '.[0].number // empty')
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --repo "$REPO" --body "Recovered: build and deploy succeeded at $(date -u +%Y-%m-%dT%H:%MZ). $RUN_URL"
              gh issue close "$open_issue" --repo "$REPO" --reason completed
            fi
            exit 0
          fi
          gh label create build-failure --repo "$REPO" --color d73a4a --description "The daily build or deploy failed" --force >/dev/null 2>&1 || true
          body="The daily build failed at $(date -u +%Y-%m-%dT%H:%MZ) (build: $BUILD_RESULT, deploy: $DEPLOY_RESULT).

Run log: $RUN_URL

Until this is fixed the page keeps serving the last good build. See docs/RUNBOOK.md."
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Daily build failed ($(date -u +%Y-%m-%d))" --label build-failure --assignee "${{ github.repository_owner }}" --body "$body"
          fi
